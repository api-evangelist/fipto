note: >-
  Fipto does NOT use RFC 9457 problem+json. Every error response is application/json. Two distinct
  envelopes are in use across the same API, which is itself the finding: a JSON:API-shaped
  `json_error` object (source.pointer + detail + code) declared in components, and a flat
  `{ "data": { "message": "..." } }` envelope used by the newer Automations, Quotes, Beneficiaries
  and Payment Links 400 responses. An agent must handle both. Fipto publishes no consolidated error
  reference page, so the catalog below is derived from the contract only.
envelopes:
- id: json_error
  schema: components.schemas.json_error
  content_type: application/json
  shape:
    source: {pointer: string}
    detail: string
    code: string
  note: JSON:API error-object shape. `code` is a free-form string; no enumerated registry is published.
- id: data_message
  content_type: application/json
  shape:
    data: {message: string}
  note: >-
    Used by the 400 responses on createAQuote, confirmQuoteStatus, createBeneficiary,
    createBatchBeneficiaries, createPaymentLinks and all five Automations operations. The spec
    constrains `message` with a oneOf of regex `pattern`s rather than an enum of codes, so the
    machine-readable discriminator is the literal English sentence.
