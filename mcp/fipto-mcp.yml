configuration:
- name: BASE_URL
  description: Base URL of the Fipto API (https://api.fipto.app for production, https://api.demo.fipto.tech for demo)
  required: true
- name: USER_ID
  description: UUID of the Fipto API user; used as the HTTP-signature keyId
  required: true
- name: PRIVATE_KEY
  description: PEM RSA private key matching the public key registered with Fipto; signs every request
  required: true
tools:
- name: list_my_companies
  description: Lists all companies the current user is a member of at Fipto.
  parameters: []
  source_operation: openapi/fipto-customer-api-openapi.yml#listCompaniesByUser
- name: list_company_wallets
  description: Lists all wallets for a specific company at Fipto.
  parameters:
  - {name: company_id, type: string, format: uuid, required: true}
  source_operation: openapi/fipto-customer-api-openapi.yml#listWallets
- name: list_company_transactions
  description: Lists all transactions for a specific company at Fipto, with filters.
  parameters:
  - {name: company_id, type: string, format: uuid, required: true}
  - {name: transaction_types, type: array, required: false}
  - {name: asset_types, type: array, required: false}
  - {name: page_number, type: number, required: false}
  - {name: page_size, type: number, required: false}
  - {name: sort, type: string, required: false}
  - {name: wallet_id, type: string, format: uuid, required: false}
