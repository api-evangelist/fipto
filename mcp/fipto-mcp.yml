  package: https://www.npmjs.com/package/@fipto/mcp-fipto
  auth: api-key
  verified: searched
  note: >-
    Fipto ships NO hosted/remote MCP endpoint. The server is a local stdio process an operator installs
    and runs themselves; an agent cannot reach Fipto over MCP without a human first configuring the
    command with a USER_ID and a PRIVATE_KEY. The README's own VS Code example uses
    command "npx", args ["-y","@fipto/mcp-fipto"], StdioServerTransport.
