source: registry.npmjs.org, pypi.org, docs.fipto.com
note: >-
  Fipto publishes NO first-party client SDK in any language. The only first-party package on any
  registry is the MCP server. The documented integration paths are raw HTTP with a hand-built
  HTTP-signature header, the public Postman collection (whose pre-request script does the signing),
  or the MCP server. No `SDKs` pointer is emitted in apis.yml because an MCP server is not a client
  library and asserting otherwise would credit Fipto with SDKs it does not ship.
