aid: fipto
name: Fipto
description: 'Fipto is a Paris-based enterprise stablecoin payments and multi-currency accounts platform
  that lets businesses send and receive both fiat and stablecoin payments, hold multi-asset wallets with
  EUR and USD named accounts, convert between fiat and digital currencies, and automate treasury and
  reconciliation. It is licensed as a Payment Institution by France''s ACPR (code 17908) and as a
  Crypto-Asset Service Provider by the AMF under MiCA (authorization A2026-009), and is ISO/IEC
  27001:2022 certified. Fipto publishes a REST API (OpenAPI 3.0.3) covering wallets, beneficiaries,
  payouts, transactions, conversions, payment links, automation rules and an AISP/PISP access surface,
  plus signed webhooks and an open-source Model Context Protocol server for AI agents.'
