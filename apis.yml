apis:
- aid: fipto:customer-api
  name: Fipto API
  description: 'The Fipto REST API (OpenAPI 3.0.3, version 4.3.0) for stablecoin and fiat payments:
    company assets, multi-asset wallets and wallet details (IBAN/blockchain addresses), beneficiaries
    with Travel Rule and Verification of Payee support, payouts and internal transfers, transaction and
    operation search, conversions and quotes, payment links, automation rules, and a delegated AISP/PISP
    access surface. Requests are authenticated with HTTP Message Signatures (draft-cavage-12) using an
    RSA key pair issued during onboarding.'
