      oneOf:
      - $ref: '#/components/schemas/beneficiary_travel_rule_custodial'
      - $ref: '#/components/schemas/travel_rule_non_custodial'
      - type: object
        readOnly: true
        additionalProperties: false
    travel_rule:
      description: Travel rule data linked to a beneficiary
      oneOf:
      - $ref: '#/components/schemas/travel_rule_custodial'
      - $ref: '#/components/schemas/travel_rule_non_custodial'
      - type: object
        readOnly: true
        additionalProperties: false
    travel_rule_custodial:
      description: Custodial travel rule information.
      type: object
      required:
      - vasp_name
      properties:
        vasp_name:
          $ref: '#/components/schemas/vasp_name'
        vasp_did:
          type: string
          pattern: ^did:[a-zA-Z0-9]*:.*$
          example: did:ethr:0x123456789abcdef
    beneficiary_travel_rule_custodial:
      description: Custodial travel rule information.
      type: object
      oneOf:
      - properties:
          vasp_name:
            $ref: '#/components/schemas/vasp_name'
          vasp_did:
            type: string
            pattern: ^did:[a-zA-Z0-9]*:.*$
            example: did:ethr:0x123456789abcdef
        required:
        - vasp_did
      - properties:
          vasp_name:
            $ref: '#/components/schemas/vasp_name'
          vasp_website:
            type: string
            format: url
        required:
        - vasp_website
        - vasp_name
    travel_rule_non_custodial:
      description: Non custodial travel rule information.
      type: object
      required:
      - is_self_hosted
      properties:
        is_self_hosted:
          type: boolean
          enum:
          - true
    amount:
      type: string
      description: Amount expressed in a currency.
      example: '1000'
      pattern: ^-?\d*(\.\d+)?$
    positive_amount:
      type: string
      description: Strictly positive amount expressed in the currency of the transaction.
      example: '1000'
      pattern: ^\d+(\.\d+)?$
    strictly_positive_amount:
      type: string
      description: Strictly positive amount expressed in the currency of the transaction.
      example: '1000'
      pattern: ^(0\.\d*[1-9]\d*|[1-9]\d*(\.\d+)?)$
    positive_amount_greater_or_equal_1_with_two_decimals:
      type: string
      description: Strictly positive amount greater than or equal to 1, with up to two decimal places.
      example: '1.00'
      pattern: ^[1-9]\d*(\.\d{1,2})?$
    positive_number_in_range_0_100:
      type: string
      description: Any decimal number between 0 and 100.
      example: '0.9'
      pattern: ^(100(\.0+)?|(\d{1,2})(\.\d+)?)$
    uuid:
      type: string
      pattern: '[0-9a-fA-F]{8}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{4}\b-[0-9a-fA-F]{12}'
      description: 128-bit value used to uniquely identify an object.
      example: 123e4567-e89b-12d3-a456-426614174000
    partner_name:
      type: string
      description: Partner name.
      enum:
      - fireblocks
      - clearbank
      - equals_money
    request_id:
      type: string
      pattern: '[0-9]-[0-9a-fA-F]{8}-[0-9a-fA-F]{24}'
      description: Request identifier.
    object_id:
      description: Unique id of object
      type: object
      properties:
        id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/uuid'
    data_default:
      description: Fields required on all objects.
      type: object
      required:
      - type
      - attributes
      properties:
        type:
          type: string
        attributes:
          type: object
          minProperties: 1
    beneficiary_raw_data:
      description: Beneficiary information without id.
      allOf:
      - $ref: '#/components/schemas/data_default'
      - type: object
        properties:
          type:
            type: string
            default: beneficiary
          attributes:
            required:
            - description
            - wallet_details
            - beneficiary_info
            properties:
              description:
                allOf:
                - $ref: '#/components/schemas/sanitized_string_with_dot'
                minLength: 1
                maxLength: 80
                description: Description of the beneficiary that you want to add (e.g. "external wallet account").
              wallet_details:
                $ref: '#/components/schemas/wallet_details_beneficiary'
              beneficiary_info:
                oneOf:
                - $ref: '#/components/schemas/beneficiary_info_natural'
                - $ref: '#/components/schemas/beneficiary_info_legal'
                - $ref: '#/components/schemas/beneficiary_is_self'
                discriminator:
                  propertyName: type
                  mapping:
                    individual: '#/components/schemas/beneficiary_info_natural'
                    company: '#/components/schemas/beneficiary_info_legal'
                    self: '#/components/schemas/beneficiary_is_self'
    beneficiary_status_update_request:
      type: object
      description: Data to update the status of a beneficiary.
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - active
          - rejected
          description: New status to apply to the beneficiary.
    beneficiary_status_update:
      type: object
      description: Information about the status update of a beneficiary.
      required:
      - beneficiary_id
      - status
      properties:
        beneficiary_id:
          $ref: '#/components/schemas/uuid'
        status:
          type: string
          enum:
          - active
          - rejected
    beneficiary_data:
      description: Beneficiary information with id
      allOf:
      - $ref: '#/components/schemas/object_id'
      - $ref: '#/components/schemas/beneficiary_raw_data'
      - type: object
        properties:
          attributes:
            properties:
              status:
                $ref: '#/components/schemas/beneficiary_status'
              internal:
                type: boolean
                readOnly: true
                description: True if the beneficiary's bank details match a Fipto wallet deposit address. Cannot be used as
                  an automation payout destination.
              corridor:
                $ref: '#/components/schemas/beneficiary_corridor'
              created_by:
                allOf:
                - $ref: '#/components/schemas/uuid'
                readOnly: true
                description: The id of the user that created the beneficiary.
              pending_action_initiated_by:
                allOf:
                - $ref: '#/components/schemas/uuid'
                readOnly: true
                description: User ID that initiated the pending create_beneficiary action, if any.
              caller_can_approve:
                type: boolean
                readOnly: true
                description: Whether the requesting user may approve the pending action on this beneficiary.
              approval_progress:
                allOf:
                - $ref: '#/components/schemas/approval_progress'
                readOnly: true
                description: AND multi-rule approval progress for the pending create_beneficiary action, if any.
    beneficiary_batch_item:
      description: Beneficiary data used in batch endpoints.
      type: object
      required:
      - data
      properties:
        errors:
          readOnly: true
          description: list of blocking errors
          type: array
          items:
            $ref: '#/components/schemas/json_error'
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - type
            - attributes
            properties:
              type:
                type: string
                enum:
                - batch_beneficiary
              attributes:
                type: object
                additionalProperties: false
                properties:
                  description:
