    admin_request_for_quote:
      description: A newly submitted request for quote (RFQ)
      allOf:
      - $ref: '#/components/schemas/request_for_quote'
      - type: object
        required:
        - attributes
        properties:
          attributes:
            type: object
            required:
            - company_id
            properties:
              company_id:
                readOnly: true
                allOf:
                - $ref: '#/components/schemas/uuid'
                - description: The company id of the user that requested the RFQ.
    admin_request_for_quote_validated:
      description: RFQ validated
      allOf:
      - $ref: '#/components/schemas/request_for_quote_validated'
      - type: object
        required:
        - attributes
        properties:
          attributes:
            type: object
            required:
            - company_id
            properties:
              partner:
                $ref: '#/components/schemas/conversion_partner'
              company_id:
                readOnly: true
                allOf:
                - $ref: '#/components/schemas/uuid'
                - description: The company id of the user that requested the RFQ.
    request_for_quote:
      description: A newly submitted request for quote (RFQ)
      allOf:
      - $ref: '#/components/schemas/request_for_quote_common'
      - type: object
        required:
        - attributes
        properties:
          attributes:
            oneOf:
            - type: object
              required:
              - buy_amount
              - status
              properties:
                status:
                  readOnly: true
                  type: string
                  enum:
                  - submitted
                buy_amount:
                  $ref: '#/components/schemas/strictly_positive_amount'
            - type: object
              required:
              - sell_amount
              - status
              properties:
                status:
                  readOnly: true
                  type: string
                  enum:
                  - submitted
                  - cancelled
                sell_amount:
                  $ref: '#/components/schemas/strictly_positive_amount'
            - type: object
              required:
              - buy_amount
              - sell_amount
              - status
              properties:
                status:
                  readOnly: true
                  type: string
                  enum:
                  - validated
                buy_amount:
                  $ref: '#/components/schemas/strictly_positive_amount'
                sell_amount:
                  $ref: '#/components/schemas/strictly_positive_amount'
    request_for_quote_validated:
      description: RFQ validated
      allOf:
      - $ref: '#/components/schemas/request_for_quote_common'
      - type: object
        required:
        - attributes
        properties:
          attributes:
            type: object
            required:
            - buy_amount
            - sell_amount
            - status
            properties:
              status:
                readOnly: true
                type: string
                enum:
                - validated
              buy_amount:
                $ref: '#/components/schemas/strictly_positive_amount'
              sell_amount:
                $ref: '#/components/schemas/strictly_positive_amount'
    request_for_quote_common:
      description: RFQ common data
      allOf:
      - $ref: '#/components/schemas/data_default'
      - $ref: '#/components/schemas/object_id'
      - type: object
        properties:
          type:
            type: string
            enum:
            - rfq
          attributes:
            type: object
            required:
            - origin
            - buy_wallet_id
            - sell_wallet_id
            - created_at
            properties:
              origin:
                readOnly: true
                allOf:
                - $ref: '#/components/schemas/rfq_origin'
                - description: The origin of the RFQ.
              dealt_by:
                readOnly: true
                allOf:
                - $ref: '#/components/schemas/uuid'
                - description: The id of the employee that validated the RFQ.
              requested_by:
                allOf:
                - $ref: '#/components/schemas/uuid'
                - description: The id of the user that requested the RFQ.
              created_at:
                readOnly: true
                allOf:
                - $ref: '#/components/schemas/created_at'
              buy_wallet_id:
                $ref: '#/components/schemas/uuid'
              buy_wallet_name:
                type: string
                readOnly: true
                description: The name of the wallet.
                example: My wallet
              buy_wallet_asset_code:
                type: string
                readOnly: true
                description: The asset code of the wallet.
                example: BTC
              sell_wallet_id:
                $ref: '#/components/schemas/uuid'
              sell_wallet_name:
                type: string
                readOnly: true
                description: The name of the wallet.
                example: My wallet
              sell_wallet_asset_code:
                type: string
                readOnly: true
                description: The asset code of the wallet.
                example: EUR
    conversion_partner:
      description: Name of the partner used to make the conversion
      type: string
      example: Kraken
    sanitized_string:
      type: string
      description: Allow alphanumeric, +, -, _, &, (, ), °,  space, single quote, comma, and all accented characters.
      pattern: ^[a-zA-Z0-9À-ɏ\s+'()_&,°-]*$
    sanitized_string_with_dot:
      type: string
      description: Allow alphanumeric, +, -, _, &, (, ), °, .,  space, single quote, comma, and all accented characters.
      pattern: ^[a-zA-Z0-9À-ɏ\s+'()_&,°.-]*$
    vasp_name:
      type: string
      description: Allow alphanumeric, +, -, _, &, (, ), °, ., ;, space, single quote, comma, and all accented characters.
      pattern: ^[a-zA-Z0-9À-ɏ\s+'()_&,°.;-]*$
    company_name:
      type: string
      description: Allow alphanumeric, +, -, _, &, (, ), ., space, single quote, comma, and all accented characters.
      pattern: ^[a-zA-Z0-9À-ɏ\s+'()_&,.\-]*$
      maxLength: 100
    country_code:
      type: string
      description: Code 2 characters of country
      pattern: ^[A-Z]{2}$
    sanitized_name:
      type: string
      description: A string that must contain only upper and lower case letters, spaces, hyphens, and single quote characters
      pattern: ^[a-zA-Z\s\-'À-ſ]+$
