    equals_money_payload:
      description: Payload used to pass the data to EqualsMoney partner.
      required:
      - market
      - contact
      - account
      properties:
        market:
          description: The market relating to the license that the account operates under.
          type: string
          enum:
          - EU
          - UK
          - US
        contact:
          description: Information about the contact holding the account.
          required:
          - firstName
          - lastName
          - email
          - phone
          - address
          type: object
          properties:
            firstName:
              description: Firstname of the holder.
              type: string
            lastName:
              description: Lastname of the holder.
              type: string
            email:
              description: Email of the holder.
              type: string
            phone:
              description: Phone number of the holder.
              type: string
            dob:
              description: Date of birth of the holder in the format YYYY-MM-DD.
              example: '2024-01-25'
              type: string
            address:
              allOf:
              - description: Address of the holder.
              - $ref: '#/components/schemas/equals_money_address'
        account:
          description: Informations of the account.
          required:
          - companyNumber
          - type
          - kyc
          type: object
          properties:
            companyNumber:
              description: Number of the company.
              type: string
            incorporationDate:
              description: Date of the company's incorporation.
              type: string
            type:
              description: Type of the company.
              type: string
              enum:
              - ltd
              - private-limited-guarant-nsc-limited-exemption
              - private-limited-guarant-nsc
              - llp
              - plc
              - sole_trader
              - charity
              - charitable-incorporated-organisation
              - partnership
              - assurance-company
              - converted-or-closed
              - limited_by_guarantee
              - limited-partnership
              - oversea-company
              - private-unlimited
              - royal-charter
              - registered-society-non-jurisdictional
              - trust
              - uk-establishment
              - other
            website:
              description: Website of the company.
              type: string
            onboardingDetail:
              description: Optional additional details about the account.
              type: string
            kyc:
              description: Informations about the KYC.
              required:
              - mainPurpose
              - sourceOfFunds
              - destinationOfFunds
              - currenciesRequired
              - annualVolume
              - numberOfPayments
              properties:
                mainPurpose:
                  description: List of purpose usage of the account.
                  type: array
                  items:
                    type: string
                    enum:
                    - Business acquisition
                    - Business costs/revenue
                    - Charity
                    - Currency purchase/sale
                    - Dividend payments
                    - Inheritance
                    - Intercompany Transfers
                    - Investment
                    - Legal fees
                    - Loan
                    - Mortgage payments
                    - On-going payments to family
                    - One off payment
                    - Payment of services
                    - Payment to suppliers
                    - Property maintenance
                    - Property purchase
                    - Property sale
                    - Purchase of goods
                    - Relocating abroad
                    - Repatriation
                    - Royalties
                    - Sale of shares
                    - Study fees/tuition
                    - Vehicle purchase
                    - Incentives/Grants
                    - Tax payments
                    - Director's fees
                sourceOfFunds:
                  description: List of the source of the account.
                  type: array
                  items:
                    type: string
                    enum:
                    - salary
                    - savings
                    - property
                    - cryptocurrency
                    - inheritance
                    - other
                destinationOfFunds:
                  description: List of the destinations of the account.
                  type: array
                  items:
                    $ref: '#/components/schemas/country_code'
                currenciesRequired:
                  description: List of the account's currencies.
                  type: array
                  items:
                    type: string
                annualVolume:
                  description: Annual volume though the account.
                  type: string
                  enum:
                  - Less than £10,000
                  - £10,000 - £50,000
                  - £50,000 - £100,000
                  - £100,000 - £250,000
                  - £250,000 - £1,000,000
                  - £1,000,000 - £5,000,000
                  - More than £5,000,000
                numberOfPayments:
                  description: Number of payments done with the account.
                  type: string
                  enum:
                  - Fewer than 5 payments
                  - 5 - 10 payments
                  - 10 - 20 payments
                  - More than 20 payments
