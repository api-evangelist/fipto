    beneficiary_status_admin:
      description: Internal beneficiary status values
      type: string
      enum:
      - pending
      - action_required
      - rejected
      - active
      - inactive
      - awaiting_approval
    beneficiary_admin_data:
      description: Beneficiary information with admin specific fields.
      allOf:
      - $ref: '#/components/schemas/object_id'
      - $ref: '#/components/schemas/beneficiary_raw_data'
      - type: object
        properties:
          attributes:
            required:
            - status
            properties:
              status:
                $ref: '#/components/schemas/beneficiary_status_admin'
              company_id:
                $ref: '#/components/schemas/uuid'
              company_name:
                allOf:
                - $ref: '#/components/schemas/sanitized_string'
                description: Name of the company owning the beneficiary.
              corridor:
                $ref: '#/components/schemas/beneficiary_corridor'
    beneficiary_corridor:
      type: string
      readOnly: true
      description: The beneficiary's payout corridor — the discriminator used on typed create. `digital` for crypto wallets;
        for fiat, the destination currency (e.g. `EUR`, `USD`, `COP`) or a `<CURRENCY>_<IDENTIFIER>` key for the multi-form
        rails (BRL PIX, HKD FPS). Read-only.
      enum:
      - digital
      - EUR
      - USD
      - COP
      - MXN
      - NGN
      - SGD
      - CNY
      - PHP
      - BRL_TAX_ID
      - BRL_EVP_RANDOM
      - BRL_EMAIL
      - BRL_PHONE_NUMBER
      - HKD_FPS_ID
      - HKD_FPS_EMAIL
      - HKD_FPS_PHONE_NUMBER
      - HKD_FPS_ACCOUNT_NUMBER
      - HKD_ACCOUNT_NUMBER
      example: COP
    counterparty_data:
      description: Counterparty information.
      allOf:
      - $ref: '#/components/schemas/object_id'
      - $ref: '#/components/schemas/data_default'
      - type: object
        properties:
          type:
            type: string
            enum:
            - counterparty
          attributes:
            required:
            - description
            - wallet_details
            - beneficiary_info
            properties:
              description:
                allOf:
                - $ref: '#/components/schemas/sanitized_string_with_dot'
                minLength: 1
                maxLength: 80
                description: Description of the beneficiary that you want to add (e.g. "external wallet account").
              reference:
                allOf:
                - $ref: '#/components/schemas/fiat_reference'
                description: Default reference of the counterparty to initiate a payment.
              wallet_details:
                $ref: '#/components/schemas/wallet_details_beneficiary'
              beneficiary_info:
                oneOf:
                - $ref: '#/components/schemas/beneficiary_info_natural'
                - $ref: '#/components/schemas/beneficiary_info_legal'
                - $ref: '#/components/schemas/beneficiary_is_self'
                discriminator:
                  propertyName: type
                  mapping:
                    individual: '#/components/schemas/beneficiary_info_natural'
                    company: '#/components/schemas/beneficiary_info_legal'
                    self: '#/components/schemas/beneficiary_is_self'
    counterparty_data_response:
      description: Counterparty as returned by GET/list/create responses (adds read-only fields to the request shape).
      allOf:
      - $ref: '#/components/schemas/counterparty_data'
      - type: object
        properties:
          attributes:
            properties:
              corridor:
                $ref: '#/components/schemas/beneficiary_corridor'
    travel_rule_status:
