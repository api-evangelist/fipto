                  - $ref: '#/components/schemas/asset'
                available_balance:
                  allOf:
                  - readOnly: true
                  - $ref: '#/components/schemas/positive_amount'
            warnings:
              readOnly: true
              description: list of non-blocking errors for the current payout.
              type: array
              items:
                $ref: '#/components/schemas/json_error'
    fi_batch_payment:
      description: Customer batch payment.
      type: object
      required:
      - attributes
      - type
      properties:
        type:
          type: string
          enum:
          - fi_batch_payment_digital
        attributes:
          type: object
          required:
          - beneficiary
          - source_wallet_details
          properties:
            amount:
              anyOf:
              - type: string
                readOnly: true
              - $ref: '#/components/schemas/strictly_positive_amount'
            reference:
              type: string
            beneficiary:
              $ref: '#/components/schemas/fi_batch_payment_beneficiary_digital'
            source_wallet_details:
              type: object
              properties:
                wallet_id:
                  $ref: '#/components/schemas/uuid'
                wallet_name:
                  readOnly: true
                  type: string
                asset_code:
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/asset'
                available_balance:
                  readOnly: true
                  allOf:
                  - $ref: '#/components/schemas/positive_amount'
            warnings:
              readOnly: true
              description: list of non-blocking errors for the current payout.
              type: array
              items:
                $ref: '#/components/schemas/json_error'
    batch_payout_digital:
      description: Digital batch payout.
      allOf:
      - $ref: '#/components/schemas/batch_payout_common'
      - type: object
        required:
        - attributes
        properties:
          attributes:
            type: object
            required:
            - beneficiary
            - source_wallet_details
            properties:
              reference:
                type: string
              beneficiary:
                $ref: '#/components/schemas/batch_payout_beneficiary_digital'
              source_wallet_details:
                type: object
                required:
                - wallet_id
                properties:
                  wallet_id:
                    $ref: '#/components/schemas/uuid'
    batch_payout_fiat:
      description: representation of fiat payout attributes in batch payout.
      allOf:
      - $ref: '#/components/schemas/batch_payout_common'
      - type: object
        required:
        - attributes
        properties:
          attributes:
            type: object
            required:
            - beneficiary
            - source_wallet_details
            properties:
              batch_verification_id:
                description: ID of the asynchronous verification batch running for VoP (Verification of Payee).
                allOf:
                - $ref: '#/components/schemas/uuid'
              beneficiary_verification_id:
                description: ID of the verification made on the beneficiary for VoP (Verification of Payee).
                allOf:
                - $ref: '#/components/schemas/uuid'
              reference:
                $ref: '#/components/schemas/fiat_reference'
              beneficiary:
                $ref: '#/components/schemas/batch_payout_beneficiary_fiat'
              source_wallet_details:
                type: object
                required:
                - iban
                - bic
                properties:
                  iban:
                    type: string
                  bic:
                    type: string
              external_payment_id:
                type: string
                readOnly: true
              execution_date:
                type: string
                readOnly: true
                format: date
                example: '2019-05-17'
    customer_batch_payout_beneficiary_common:
      description: Shared attributes between the different beneficiary schemas.
      type: object
      required:
      - company_id
      - description
      properties:
        description:
          type: string
        company_id:
          $ref: '#/components/schemas/uuid'
        beneficiary_id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/uuid'
        beneficiary_info:
          $ref: '#/components/schemas/beneficiary_is_self'
        wallet_details:
          type: object
          required:
          - asset_code
          properties:
            asset_code:
              $ref: '#/components/schemas/asset'
    batch_payout_beneficiary_common:
      description: Shared attributes between the different beneficiary schemas.
      type: object
      required:
      - company_id
      - description
      properties:
        description:
          $ref: '#/components/schemas/sanitized_string_with_dot'
        company_id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/uuid'
        beneficiary_id:
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/uuid'
        beneficiary_info:
          oneOf:
          - $ref: '#/components/schemas/batch_payout_beneficiary_info_natural'
          - $ref: '#/components/schemas/batch_payout_beneficiary_info_legal'
          - $ref: '#/components/schemas/beneficiary_is_self'
          - $ref: '#/components/schemas/batch_payout_beneficiary_invalid'
          discriminator:
            propertyName: type
            mapping:
              individual: '#/components/schemas/batch_payout_beneficiary_info_natural'
              company: '#/components/schemas/batch_payout_beneficiary_info_legal'
              self: '#/components/schemas/beneficiary_is_self'
              invalid: '#/components/schemas/batch_payout_beneficiary_invalid'
        wallet_details:
          type: object
          required:
          - asset_code
          properties:
            asset_code:
              $ref: '#/components/schemas/asset'
    fi_batch_payment_beneficiary_digital:
      description: representation of digital payout attributes in batch payout.
      allOf:
      - $ref: '#/components/schemas/customer_batch_payout_beneficiary_common'
      - type: object
        required:
        - wallet_details
        - travel_rule
        properties:
          wallet_details:
            type: object
            required:
            - address
            properties:
              address:
                $ref: '#/components/schemas/wallet_address'
              tag:
                type: string
          travel_rule:
            anyOf:
            - $ref: '#/components/schemas/beneficiary_travel_rule'
            - type: object
              properties:
                vasp_name:
                  readOnly: true
                  type: string
                vasp_website:
                  readOnly: true
                  type: string
                vasp_did:
                  readOnly: true
                  type: string
                is_self_hosted:
                  readOnly: true
                  type: boolean
    batch_payout_beneficiary_digital:
      description: representation of digital payout attributes in batch payout.
      allOf:
      - $ref: '#/components/schemas/batch_payout_beneficiary_common'
      - type: object
        required:
        - wallet_details
        properties:
          wallet_details:
            type: object
            required:
            - address
            properties:
              address:
                $ref: '#/components/schemas/wallet_address'
              tag:
                type: string
          travel_rule:
            anyOf:
            - $ref: '#/components/schemas/beneficiary_travel_rule'
            - type: object
              properties:
                vasp_name:
                  readOnly: true
                  type: string
                vasp_website:
                  readOnly: true
                  type: string
                vasp_did:
                  readOnly: true
                  type: string
                is_self_hosted:
                  readOnly: true
                  type: boolean
    batch_payout_beneficiary_fiat:
      description: representation of fiat payout attributes in batch payout.
      allOf:
      - $ref: '#/components/schemas/batch_payout_beneficiary_common'
      - type: object
        required:
        - wallet_details
        properties:
          wallet_details:
            $ref: '#/components/schemas/account_identifiers'
    batch_payout_beneficiary_info_legal:
      description: Information about a beneficiary company of a batch payment payout.
      anyOf:
      - $ref: '#/components/schemas/travel_rule_sender_info_legal'
      - type: object
        readOnly: true
        description: Data about Travel Rule's sender of type Natural.
        properties:
          type:
            type: string
            enum:
            - company
          name:
            type: string
            maxLength: 70
          address:
            $ref: '#/components/schemas/address'
    batch_payout_beneficiary_info_natural:
      description: Information about a beneficiary individual of a batch payment payout.
      anyOf:
      - $ref: '#/components/schemas/travel_rule_sender_info_natural'
      - type: object
        readOnly: true
        description: Data about Travel Rule's sender of type Natural.
        properties:
          type:
            type: string
            enum:
            - individual
          first_name:
            type: string
            description: First name of the sender.
            example: Victor
            maxLength: 30
          last_name:
            type: string
            description: Last name of the sender.
            example: Duponthieu
            maxLength: 30
          address:
            $ref: '#/components/schemas/address'
    batch_payout_beneficiary_invalid:
      description: Placeholder beneficiary returned when the beneficiary of a batch payment payout is invalid.
      type: object
      readOnly: true
      properties:
        type:
          type: string
          enum:
          - invalid
    account_number:
      description: The account number of the beneficiary who will receive the funds. This is the unique identifier for the
        recipient's bank account.
      type: string
      example: FR1420041010050500013M02606
    bank_identifier:
      description: The bank's identification code, which can be either a BIC (Bank Identifier Code) for international transfers
        or a routing number for domestic transfers. This identifies the financial institution where the beneficiary's account
        is held.
      type: string
      example: BPPCFRTT
    vop_code:
      type: string
      enum:
      - MTCH
      - NMTC
      - CMTC
      - NOAP
      - NOAV
      description: "Code identifying the result of the verification, as defined in the VOP specification:\n  - MTCH: \"Match\"\
        \ (the beneficiary name being matches what is registered at the bank for that IBAN)\n  - NMTC: \"No match\"\n  - CMTC:\
        \ \"Close match\"\n  - NOAP: \"Not applicable\" (verification by the VOP network is not possible or applicable)\n\
        A fifth custom code, NOAV (\"Not available\") indicates that Fipto could not connect to the VOP network to make the\
        \ check.\n"
    vop_close_match:
      type: string
      description: 'If the code is "CMTC" (close match), this field contains the string that was returned as the name of the
        beneficiary by its bank, which differs from the name of the beneficiary as registered in our system.

        '
    fi_customer_status:
      description: Status of a financial institution customer's company.
      type: string
      enum:
      - inactive
      - active
      - pending
      - suspended
    sort_fi_customer_list:
      description: Possible sort for the list wallet.
      allOf:
      - $ref: '#/components/schemas/sort'
      enum:
      - created_at
      - updated_at
      - status
    client_onboarding_onboarding_raw_data:
      description: KYC reliance onboarding request payload.
      allOf:
      - $ref: '#/components/schemas/data_default'
      - type: object
        properties:
          type:
            type: string
            default: client_onboarding_onboarding
          attributes:
            type: object
            required:
            - company_type
            - legal_name
            - trading_name
            - legal_registration_number
            - country_of_incorporation
            - incorporation_date
            - legal_type_form
            - risk_score
            - website
            - activity
            - activity_risk
            - account_opening_main_reason
            - address
            - declared_annual_revenue
            - is_licensed_regulated
            - company_tax_id
            - company_tax_residency
            - declared_planned_yearly_volume
            - estimated_annual_transactions
            - purpose_of_relationship
            - legal_representatives
            - ubos
            properties:
              company_type:
                description: Type of the client entity.
                type: string
                enum:
                - financial_institution
                - corporate
                example: corporate
              legal_name:
                description: Legal name of the client entity.
                type: string
                minLength: 1
                maxLength: 255
                example: Acme Holdings Ltd
              trading_name:
                description: Trading name of the client entity.
                type: string
                maxLength: 255
                example: Acme Pay
              legal_registration_number:
                description: Legal registration number of the entity.
                type: string
                maxLength: 100
                example: '12345678'
              country_of_incorporation:
                allOf:
                - $ref: '#/components/schemas/country_code'
                - description: Country where the entity is incorporated.
              incorporation_date:
                description: Date of incorporation (ISO date).
                type: string
                format: date
                example: '2018-06-15'
              legal_type_form:
                description: Legal form of the entity.
                type: string
                example: Limited Company
              risk_score:
                description: Risk score assessment provided by the submitting client.
                type: object
                required:
                - score
                - level
                properties:
                  score:
                    description: Numeric risk score.
                    type: number
                    example: 35
                  level:
                    description: Risk level classification.
                    type: string
                    enum:
                    - low
                    - medium
                    - high
                    example: low
              website:
                description: Company website URL.
                type: string
                format: uri
                example: https://acmepay.example.com
              activity:
                description: Main business activity.
                type: string
                example: Online payment processing services
              activity_risk:
                description: Risk level associated with the activity.
                type: string
                enum:
                - low
                - medium
                - high
                - prohibited
                example: low
              license_type:
                description: Type of license held by the entity.
                type: string
                example: Payment Institution
              account_opening_main_reason:
                description: Declared main reason for opening the account.
                type: string
                example: Settlement of merchant payouts in EUR and GBP
              address:
                description: Registered address of the entity.
                type: object
                required:
                - street
                - city
                - country
                - postal_code
                properties:
                  street:
                    description: Street address.
                    type: string
                    example: 10 Finsbury Square
                  city:
                    description: City name.
                    type: string
                    example: London
                  country:
                    $ref: '#/components/schemas/country_code'
                  postal_code:
                    description: Postal code.
                    type: string
                    example: EC2A 1AF
              declared_annual_revenue:
                allOf:
                - $ref: '#/components/schemas/amount'
                - description: Declared annual revenue.
              is_licensed_regulated:
                description: Whether the entity is licensed or regulated.
                type: boolean
                example: true
              company_tax_id:
                description: Company tax identification number.
                type: string
                example: GB123456789
              company_tax_residency:
                allOf:
                - $ref: '#/components/schemas/country_code'
                - description: Country tax residency country.
              declared_planned_yearly_volume:
                description: Declared planned yearly transaction volume as an amount string.
                allOf:
                - $ref: '#/components/schemas/amount'
                - description: Declared planned yearly transaction volume.
              estimated_annual_transactions:
                description: Estimated annual number of transactions.
                type: integer
                minimum: 0
                example: 24000
              purpose_of_relationship:
                description: Purpose of the business relationship.
                type: string
                example: Receiving and sending payments on behalf of merchants
              legal_representatives:
                description: Legal representatives (minimum 1 entry required).
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - full_name
                  - birth_date
                  - birth_country
                  - nationality
                  - address
                  - email
                  - phone_number
                  - sex
                  - use_of_nominee_directors
                  properties:
                    full_name:
                      description: Full name of the legal representative.
                      type: string
                      example: Jane Doe
                    birth_date:
                      description: Date of birth (ISO date).
                      type: string
                      format: date
                      example: '1985-03-22'
                    birth_country:
                      $ref: '#/components/schemas/country_code'
                    nationality:
                      $ref: '#/components/schemas/country_code'
                    address:
                      description: Residential address of the legal representative.
                      type: object
                      required:
                      - street
                      - city
                      - country
                      - postal_code
                      properties:
                        street:
                          description: Street address.
                          type: string
                          example: 42 Baker Street
                        city:
                          description: City name.
                          type: string
                          example: London
                        country:
                          $ref: '#/components/schemas/country_code'
                        postal_code:
                          description: Postal code.
                          type: string
                          example: W1U 3BW
                    email:
                      description: Email address.
                      type: string
                      format: email
                      example: jane.doe@acmepay.example.com
                    phone_number:
                      description: Phone number in E.164 format.
                      type: string
                      example: '+447700900123'
                    sex:
                      description: Sex of the legal representative.
                      type: string
                      enum:
                      - M
                      - F
                      - X
                      example: F
                    use_of_nominee_directors:
                      description: Whether nominee directors are used.
                      type: boolean
                      example: false
              ubos:
                description: Ultimate Beneficial Owners (minimum 1 entry required).
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - full_name
                  - birth_date
                  - birth_country
                  - nationality
                  - ownership_percentage
                  - address
                  - sex
                  - use_of_nominee_shareholders
                  - tax_id
                  - tax_residency_country
                  - reason_of_ubo
                  properties:
                    full_name:
                      description: Full name of the UBO.
                      type: string
                      example: John Smith
                    birth_date:
                      description: Date of birth (ISO date).
                      type: string
                      format: date
                      example: '1978-11-05'
                    birth_country:
                      $ref: '#/components/schemas/country_code'
                    nationality:
                      $ref: '#/components/schemas/country_code'
                    ownership_percentage:
                      description: Percentage of ownership (0-100).
                      type: number
                      minimum: 0
                      maximum: 100
                      example: 60
                    address:
                      description: Residential address of the UBO.
                      type: object
                      required:
                      - street
                      - city
                      - country
                      - postal_code
                      properties:
                        street:
                          description: Street address.
                          type: string
                          example: 15 Elm Road
                        city:
                          description: City name.
                          type: string
                          example: Manchester
                        country:
                          $ref: '#/components/schemas/country_code'
                        postal_code:
                          description: Postal code.
                          type: string
                          example: M1 2AB
                    sex:
                      description: Sex of the UBO.
                      type: string
                      enum:
                      - M
                      - F
                      - X
                      example: M
                    use_of_nominee_shareholders:
                      description: Whether nominee shareholders are used.
                      type: boolean
                      example: false
                    tax_id:
                      description: Tax identification number.
                      type: string
                      example: AB123456C
                    tax_residency_country:
                      allOf:
                      - $ref: '#/components/schemas/country_code'
                      - description: Country of the tax residence.
                    reason_of_ubo:
                      description: Reason for UBO status.
                      type: string
                      example: Majority shareholder
    client_onboarding_onboarding_data:
      description: KYC reliance onboarding information with id and server-side fields.
      type: object
      required:
      - id
      - attributes
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        attributes:
          required:
          - status
          - created_at
          - updated_at
          - company_id
          properties:
            status:
              $ref: '#/components/schemas/client_onboarding_status'
            company_id:
              description: Company ID of the submitting parent company.
              allOf:
              - $ref: '#/components/schemas/uuid'
            onboarded_company_id:
              description: Company ID assigned by Fipto upon approval. Only present when status is approved.
              allOf:
              - $ref: '#/components/schemas/uuid'
            rejection_reason:
              description: Reason for rejection. Only present when status is rejected.
              type: string
              example: Incomplete UBO documentation
            created_at:
              description: Timestamp when the onboarding was created.
              type: string
              format: date-time
              example: '2025-01-15T10:30:00Z'
            updated_at:
              description: Timestamp when the onboarding was last updated.
              type: string
              format: date-time
              example: '2025-01-16T14:20:00Z'
    client_onboarding_status:
      description: Status of a KYC reliance onboarding.
      type: string
      enum:
      - submitted
      - approved
      - rejected
      example: submitted
    client_onboarding_review_data:
      description: Review decision for a client onboarding (approve or reject).
      allOf:
      - $ref: '#/components/schemas/data_default'
      - type: object
        properties:
          type:
            default: client_onboarding_review
          attributes:
            oneOf:
            - title: Approve
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approved
            - title: Reject
              type: object
              required:
              - decision
              - rejection_reason
              properties:
                decision:
                  type: string
                  enum:
                  - rejected
                rejection_reason:
                  description: Mandatory reason when rejecting an onboarding.
                  type: string
                  example: Incomplete UBO documentation
    sort_client_onboarding_list:
      description: Possible sort options for KYC reliance onboarding list.
      allOf:
      - $ref: '#/components/schemas/sort'
      enum:
      - created_at
      - updated_at
      - status
    authorization_group_data:
      description: Authorization group information.
      type: object
      required:
      - type
      - attributes
      properties:
        type:
          type: string
          enum:
          - authorization_group
        id:
          readOnly: true
          description: Unique identifier of the authorization group.
          example: 9de0691c-bc8d-409b-8f40-75d4f45db2f3
          allOf:
          - $ref: '#/components/schemas/uuid'
        attributes:
          type: object
          required:
          - name
          - description
          - member_count
          - rule_count
          properties:
            name:
              description: Name of the authorization group.
              example: Admins
              allOf:
              - $ref: '#/components/schemas/sanitized_name'
            description:
              description: Description of the authorization group.
              type: string
              example: Admin team with full access
            member_count:
              readOnly: true
              description: Number of members in this group.
              type: integer
              example: 5
            active_member_count:
              readOnly: true
              description: Number of active members in this group.
              type: integer
              example: 3
            rule_count:
              readOnly: true
              description: Number of authorization rules referencing this group.
              type: integer
              example: 2
    group_membership_data:
      description: Group membership information.
      type: object
      required:
      - type
      - id
      - attributes
      properties:
        type:
          type: string
          enum:
          - group_membership
        id:
          readOnly: true
          description: Unique identifier of the membership.
          example: 9de0691c-bc8d-409b-8f40-75d4f45db2f3
          allOf:
          - $ref: '#/components/schemas/uuid'
        attributes:
          type: object
          required:
          - user_id
          - name
          properties:
            user_id:
              description: The ID of the user in this group.
              example: 123e4567-e89b-12d3-a456-426614174000
              allOf:
              - $ref: '#/components/schemas/uuid'
            name:
              description: The name of the user.
              type: string
              example: Alice
    authorization_rule_data:
      description: Authorization rule information.
      type: object
      required:
      - type
      - attributes
      properties:
        type:
          type: string
          enum:
          - authorization_rule
        id:
          readOnly: true
          description: Unique identifier of the authorization rule.
          example: 9de0691c-bc8d-409b-8f40-75d4f45db2f3
          allOf:
          - $ref: '#/components/schemas/uuid'
        attributes:
          type: object
          required:
          - name
          - action_type
          - initiator_group_id
          - approver_group_id
          properties:
            name:
              description: Human-readable name of the authorization rule.
              type: string
              minLength: 1
              example: Initiate Payout - Requires Approval
            description:
              description: Detailed description of when this rule applies.
              type: string
              example: Payment Initiators can create payouts but need approval from Payment Approvers.
            action_type:
              description: The type of action this rule applies to.
              type: string
              enum:
              - initiate_single_payout
              - initiate_batch_payout
              - create_beneficiary
              - create_user
              - update_user
              example: initiate_single_payout
            initiator_group_id:
              description: The ID of the group that initiates the action.
              example: 123e4567-e89b-12d3-a456-426614174000
              allOf:
              - $ref: '#/components/schemas/uuid'
            approver_group_id:
              description: The ID of the group that approves the action.
              example: 123e4567-e89b-12d3-a456-426614174000
              allOf:
              - $ref: '#/components/schemas/uuid'
            updated_at:
              readOnly: true
              description: Timestamp of the last modification to this rule.
              type: string
              format: date-time
              example: '2026-05-11T14:30:00Z'
    action_summary_data:
      description: Authorization action summary (used in list responses).
      type: object
      required:
      - type
      - attributes
      properties:
        type:
          type: string
          enum:
          - action
        id:
          readOnly: true
          description: Unique identifier of the action.
          example: 9de0691c-bc8d-409b-8f40-75d4f45db2f3
          allOf:
          - $ref: '#/components/schemas/uuid'
        attributes:
          type: object
          properties:
            action_type:
              readOnly: true
              description: The type of action.
              type: string
              enum:
