- title: Authentication
  content: "# Getting Started\n\nBefore using the API you need to generate a private/public key pair using:\n\n    openssl\
    \ genrsa -out private-key.rsa 2048\n    openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in private-key.rsa -out\
    \ private-key.pem\n    openssl rsa -in private-key.rsa -pubout -out public-key.pem\n\nAfter sending us the public key\
    \ by email, you will receive an api key, referred below as `keyId`.\n\n## HTTP request signing\n\nAll authenticated requests\
    \ must include the following headers:\n\n- `Host`: target host of the request, e.g. \"api.fipto.app\"\n- `Date`: time\
    \ of creation of the request, in RFC1123 format\n- `Signature`: signature of the request (see below)\n\nIn addition, requests\
    \ with a body (POST, PUT, PATCH) must include:\n\n- `Content-Type`: MIME type of the body, e.g. \"application/json\"\n\
    - `Digest`: base64-encoded SHA-256 hash of the body, in the format SHA-256=<hash>\n\n`Date` values are expected to be\
    \ earlier than the present time, but not\nearlier than 1 minute.\n\n`Digest` values must obviously match to the actual\
    \ hashes of their request\nbodies. The way of getting the digest is language-dependent but a basic\nUNIX approach would\
    \ be\n\n    echo -n $BODY | openssl dgst -sha256 -binary | openssl enc -base64 -A\n\nwhere $BODY contains the string representation\
    \ of the request body.\n\n### Signature header\n\nRequests are signed and verified using the [HTTP signatures protocol](https://datatracker.ietf.org/doc/html/draft-cavage-http-signatures-12).\n\
    Libraries exist in different languages for building signed requests using that\nprotocol. We focus here on our specific\
    \ requirements.\n\nWe expect the authentication data to be present in a `Signature` header.\n\nThe \"signing string\"\
    \ itself should contain all the headers mentioned in the previous section,\nas well as the `(request-target)` pseudo-header\
    \ (see [section 2.3](https://datatracker.ietf.org/doc/html/draft-cavage-http-signatures-12#section-2.3)).\n\nFor example,\
    \ the signing string of a POST request would look like:\n\n    (request-target): post /companies/c240e5bf-863e-4f44-91aa-cc74a8b3303f/wallets\n\
    \    host: api.demo.fipto.tech\n    date: Fri, 24 Jan 2025 08:56:30 GMT\n    content-type: application/json\n    digest:\
    \ SHA-256=X48E9qOokqqrvdts8nOJRJN3OWDUoyWxBf7kbu9DBPE=\n\nThat string must then be signed using the RSA-256 algorithm,\
    \ encoded in base64 and\nincluded in the `signature` field of the header.\n\nThe following constraints apply to other\
    \ fields:\n\n- the `keyId` field must contain the UUID of your API user\n- the `headers` field must contain `(request-target)`\
    \ as well as all the headers mentioned above\n- the `algorithm` field must be \"hs2019\" (or its synonym \"rsa-sha256\"\
    )\n\nThe final header of a POST request should look like:\n\n    Signature: keyId=\"<uuid of your api user>\",algorithm=\"\
    hs2019\",headers=\"(request-target) host date content-type digest\",signature=\"<base64-encoded signature>\"\n"
