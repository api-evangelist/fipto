              public_key:
                description: The public key of the user in RSA/PEM format.
                type: string
              status:
                type: string
                enum:
                - active
                - inactive
    address:
      type: object
      description: A physical address.
      properties:
        street_address:
          type: string
          description: Street name and number of the address.
          minLength: 1
          maxLength: 70
          pattern: ^[a-zA-Z0-9À-ɏ\s+'()_&,.;/*#@°ºª:-]*$
          example: 25 rue François 1er
        zip_code:
          type: string
          description: Zip code of the beneficiary.
          minLength: 1
          maxLength: 20
          pattern: ^[a-zA-Z0-9- ]+$
          allOf:
          - $ref: '#/components/schemas/sanitized_string'
          example: '75008'
        city:
          type: string
          description: Full city name of the beneficiary.
          minLength: 1
          maxLength: 30
          allOf:
          - $ref: '#/components/schemas/sanitized_name'
          example: Paris
        country_code:
          type: string
          description: 2 letters representing a country (ISO 3166).
          pattern: ^[A-Z]{2}$
          example: FR
        state_province:
          type: string
          description: State / province / administrative division. Maps to CPN ADDRESS.stateProvince.
          maxLength: 70
          example: Guangdong
    address_required_constraint_all_fields:
      type: object
      description: Constraint on address component to ensure all fields are set.
