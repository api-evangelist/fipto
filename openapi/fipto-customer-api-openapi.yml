      description: Status of the payin.
    payout_status:
      type: string
      enum:
      - submitted
      - waiting for signature
      - waiting for topup
      - refused
      - initiated
      - screening partner compliance - in review
      - screening partner compliance - reviewed
      - screening partner compliance - failed
      - internal compliance - reviewed
      - internal compliance - rejected
      - internal compliance - medium risk
      - internal compliance - high risk
      - payment partner - processing
      - payment partner - accepted
      - payment partner - rejected
      - payment partner - payload control failed
      - payment partner - waiting for topup
      - completed
      - partner - not completed
      - awaiting approval
      example: submitted
      description: Status of the payout.
    transaction_conversion_status_public:
