        description: AISP PISP data.
        required:
        - attributes
        properties:
          attributes:
            required:
            - name
            - public_key
            - status
            properties:
              name:
                description: Name of the Aisp Pisp.
                allOf:
                - $ref: '#/components/schemas/sanitized_string'
