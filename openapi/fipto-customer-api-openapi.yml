    transaction_multi_signatures:
      description: List of payouts to sign or refuse.
      type: object
      required:
      - type
      - attributes
      properties:
        type:
          type: string
          default: batch-signing
        attributes:
          type: object
          required:
          - signatures
          properties:
            signatures:
              type: array
              items:
                type: object
                required:
                - transaction_id
                - action
                properties:
                  transaction_id:
                    $ref: '#/components/schemas/uuid'
                  action:
                    type: string
                    enum:
                    - SIGN
                    - REFUSE
    json_errors:
      description: Array of errors
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/json_error'
    approval_group:
      description: An approver group whose authorization rule is still awaiting a sign-off.
      type: object
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
    approval_result:
      description: 'Result of an approve/reject action. Authorization policy combines an

        action''s matching rules with AND semantics, so a single approval may

        leave the action pending while other approver groups still owe a

        sign-off. The result carries the resulting status, the progress

        (approvals_received of approvals_required) and the groups still pending.

        '
      type: object
      required:
      - status
      - approvals_received
      - approvals_required
      - pending_approver_groups
      properties:
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        approvals_received:
          type: integer
          description: Distinct matching rules approved so far.
        approvals_required:
          type: integer
          description: Total distinct matching rules that must each be approved.
        pending_approver_groups:
          type: array
          items:
            $ref: '#/components/schemas/approval_group'
    approval_progress:
      description: 'AND multi-rule approval progress for the pending action on an entity,

        embedded in detail responses. Present only when a pending action exists;

        a freshly-initiated action reports 0 of N.

        '
      type: object
      required:
      - approvals_received
      - approvals_required
      - pending_approver_groups
      properties:
        approvals_received:
          type: integer
        approvals_required:
          type: integer
        pending_approver_groups:
          type: array
          items:
            $ref: '#/components/schemas/approval_group'
    batch_action_result:
      description: 'Per-item outcome of a bulk approve/reject request. Successful items appear

        in results (each carrying its approval_result); failures appear in errors.

        '
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            required:
            - id
            - action
            - result
            properties:
              id:
                $ref: '#/components/schemas/uuid'
              action:
                type: string
                enum:
                - approve
                - reject
              result:
                $ref: '#/components/schemas/approval_result'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/json_error'
    wallet_consolidation_data:
