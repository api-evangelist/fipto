            - company_id
            - status
            properties:
              company_id:
                $ref: '#/components/schemas/uuid'
              status:
                $ref: '#/components/schemas/transaction_conversion_status'
    date:
      description: Date.
      type: string
      format: date-time
      example: '2017-07-21T17:32:28Z'
    asset:
      description: The symbol/ticker of the crypto asset.
      type: string
      example: BTC
    asset_type:
      description: Type of the asset.
      type: string
      enum:
      - digital
      - fiat
      example: digital
    company_type:
      description: Type of the company.
      type: string
      enum:
      - basic
      - financial_institution
      - financial_institution_customer
      example: financial_institution
    account_type:
      description: Type of the Account.
      type: string
      enum:
      - operational
      - settlement
      - segregation
      - settlement_liquidity_partner
      - withdrawal_liquidity_partner
      - parent-budget
      - virtual account
      example: operational
    asset_data:
      description: Asset data.
      type: object
      properties:
        type:
          type: string
          enum:
          - asset
        asset_code:
          $ref: '#/components/schemas/asset'
        attributes:
          properties:
            currency_code:
              description: The currency code of the asset.
              example: BTC
              allOf:
              - $ref: '#/components/schemas/asset'
            currency_name:
              type: string
              description: The currency name of the asset.
              example: Bitcoin
            decimals:
              description: The maximum number of decimal places for the given asset.
              allOf:
              - $ref: '#/components/schemas/positive_integer'
            asset_type:
              $ref: '#/components/schemas/asset_type'
            network_name:
              $ref: '#/components/schemas/network_name'
            has_access:
              $ref: '#/components/schemas/has_access'
    valuation_data:
      description: Info about a valuation.
      type: object
      properties:
        type:
          type: string
          enum:
          - valuation
        attributes:
          properties:
            valuation_asset:
              $ref: '#/components/schemas/valuation_asset'
            value:
              $ref: '#/components/schemas/positive_amount'
            valuation_date:
              type: string
              format: date-time
    beneficiary_info_natural:
      description: Data about Beneficiary of type Natural.
      allOf:
      - $ref: '#/components/schemas/beneficiary_info_base'
      - type: object
        required:
        - type
        - firstname
        - lastname
        - address
        properties:
          type:
            type: string
            enum:
            - individual
          firstname:
            type: string
            description: First name of the beneficiary.
            minLength: 1
            maxLength: 30
            allOf:
            - $ref: '#/components/schemas/sanitized_name'
            example: Victor
          lastname:
            type: string
            description: Last name of the beneficiary.
            minLength: 1
            maxLength: 30
            allOf:
            - $ref: '#/components/schemas/sanitized_name'
            example: Duponthieu
          address:
            allOf:
            - $ref: '#/components/schemas/address'
            - $ref: '#/components/schemas/address_required_constraint_all_fields'
          date_of_birth:
            type: string
            format: date
            description: Beneficiary's date of birth (YYYY-MM-DD). Maps to CPN `BENEFICIARY_DATE_OF_BIRTH`.
            example: '1987-11-23'
          nationality_code:
            description: ISO 3166-1 alpha-2 nationality code. Maps to CPN `BENEFICIARY_NATIONALITY`.
            allOf:
            - $ref: '#/components/schemas/country_code'
    beneficiary_info_legal:
      description: Data about Beneficiary of type Legal.
      allOf:
      - $ref: '#/components/schemas/beneficiary_info_base'
      - type: object
        required:
        - type
        - name
        - address
        properties:
          type:
            type: string
            enum:
            - company
          name:
            type: string
            description: The company name.
            allOf:
            - $ref: '#/components/schemas/company_name'
            minLength: 1
            maxLength: 70
          address:
            allOf:
            - $ref: '#/components/schemas/address'
            - $ref: '#/components/schemas/address_required_constraint_all_fields'
          date_of_formation:
            type: string
            format: date
            description: Date the legal entity was incorporated (YYYY-MM-DD). Maps to CPN `BENEFICIARY_DATE_OF_FORMATION`.
            example: '2012-04-02'
          country_of_formation_code:
            description: ISO 3166-1 alpha-2 country of incorporation. Maps to CPN `BENEFICIARY_COUNTRY_OF_FORMATION`.
            allOf:
            - $ref: '#/components/schemas/country_code'
    beneficiary_info_base:
      description: Shared CPN requirement fields for natural and legal beneficiaries. Not used directly; merged via allOf.
      type: object
      properties:
        phone_number:
          type: string
          description: Contact phone number for the beneficiary, in E.164 form. Maps to CPN `BENEFICIARY_PHONE_NUMBER`.
          pattern: ^\+?[1-9]\d{1,14}$
          example: '+442012345678'
        email:
          type: string
          format: email
          description: Contact email for the beneficiary. Maps to CPN `BENEFICIARY_EMAIL`.
          example: maria.gomez@example.com
        national_identification_number:
          type: string
          description: National identification document number (CURP/RFC for MX, CPF/CNPJ for BR, NRIC for SG, etc.). Maps
            to CPN `BENEFICIARY_NATIONAL_IDENTIFICATION_NUMBER` and `RECIPIENT_ID_NUMBER`.
          example: '98765432100'
        national_identification_expiration_date:
          type: string
          format: date
          description: Expiry date of the national-identification document (YYYY-MM-DD).
          example: '2031-08-15'
    beneficiary_typed_data:
      description: Beneficiary keyed on corridor (crypto or destination currency).
      allOf:
      - $ref: '#/components/schemas/data_default'
      - type: object
        required:
        - attributes
        properties:
          type:
            type: string
            enum:
            - beneficiary
          attributes:
            $ref: '#/components/schemas/beneficiary_typed_attributes'
    beneficiary_typed_attributes:
      description: Beneficiary attributes selected by corridor.
      oneOf:
      - $ref: '#/components/schemas/beneficiary_typed_digital'
      - $ref: '#/components/schemas/beneficiary_typed_eur'
      - $ref: '#/components/schemas/beneficiary_typed_cop'
      - $ref: '#/components/schemas/beneficiary_typed_brl_tax_id'
      - $ref: '#/components/schemas/beneficiary_typed_brl_evp_random'
      - $ref: '#/components/schemas/beneficiary_typed_brl_email'
      - $ref: '#/components/schemas/beneficiary_typed_brl_phone_number'
      - $ref: '#/components/schemas/beneficiary_typed_mxn'
      - $ref: '#/components/schemas/beneficiary_typed_ngn'
      - $ref: '#/components/schemas/beneficiary_typed_sgd'
      - $ref: '#/components/schemas/beneficiary_typed_cny'
      - $ref: '#/components/schemas/beneficiary_typed_php'
      - $ref: '#/components/schemas/beneficiary_typed_hkd_fps_id'
      - $ref: '#/components/schemas/beneficiary_typed_hkd_fps_email'
      - $ref: '#/components/schemas/beneficiary_typed_hkd_fps_phone_number'
      - $ref: '#/components/schemas/beneficiary_typed_hkd_fps_account_number'
      - $ref: '#/components/schemas/beneficiary_typed_hkd_account_number'
      discriminator:
        propertyName: corridor
        mapping:
          digital: '#/components/schemas/beneficiary_typed_digital'
          EUR: '#/components/schemas/beneficiary_typed_eur'
          COP: '#/components/schemas/beneficiary_typed_cop'
          BRL_TAX_ID: '#/components/schemas/beneficiary_typed_brl_tax_id'
          BRL_EVP_RANDOM: '#/components/schemas/beneficiary_typed_brl_evp_random'
          BRL_EMAIL: '#/components/schemas/beneficiary_typed_brl_email'
          BRL_PHONE_NUMBER: '#/components/schemas/beneficiary_typed_brl_phone_number'
          MXN: '#/components/schemas/beneficiary_typed_mxn'
          NGN: '#/components/schemas/beneficiary_typed_ngn'
          SGD: '#/components/schemas/beneficiary_typed_sgd'
          CNY: '#/components/schemas/beneficiary_typed_cny'
          PHP: '#/components/schemas/beneficiary_typed_php'
          HKD_FPS_ID: '#/components/schemas/beneficiary_typed_hkd_fps_id'
          HKD_FPS_EMAIL: '#/components/schemas/beneficiary_typed_hkd_fps_email'
          HKD_FPS_PHONE_NUMBER: '#/components/schemas/beneficiary_typed_hkd_fps_phone_number'
          HKD_FPS_ACCOUNT_NUMBER: '#/components/schemas/beneficiary_typed_hkd_fps_account_number'
          HKD_ACCOUNT_NUMBER: '#/components/schemas/beneficiary_typed_hkd_account_number'
    beneficiary_description:
      description: Free-text label of the beneficiary, shown in listings.
      allOf:
      - $ref: '#/components/schemas/sanitized_string_with_dot'
      minLength: 1
      maxLength: 80
      example: My beneficiary
    beneficiary_info_choice:
      description: Beneficiary identity — individual, company, or self.
      oneOf:
      - $ref: '#/components/schemas/beneficiary_info_natural'
      - $ref: '#/components/schemas/beneficiary_info_legal'
      - $ref: '#/components/schemas/beneficiary_is_self'
      discriminator:
        propertyName: type
        mapping:
          individual: '#/components/schemas/beneficiary_info_natural'
          company: '#/components/schemas/beneficiary_info_legal'
          self: '#/components/schemas/beneficiary_is_self'
    beneficiary_info_natural_id_required:
      description: Individual beneficiary that must carry a national identification number.
      allOf:
      - $ref: '#/components/schemas/beneficiary_info_natural'
      - required:
        - national_identification_number
    beneficiary_info_legal_id_required:
      description: Company beneficiary that must carry a national identification number.
      allOf:
      - $ref: '#/components/schemas/beneficiary_info_legal'
      - required:
        - national_identification_number
    beneficiary_info_with_national_id:
      description: 'Identity for corridors that require a national id (e.g. CO, BR, MX). The id

        is required on tier beneficiaries (individual / company); ''self'' carries no

        national id in the payload — it is taken from the originator company at

        payout time.

        '
      oneOf:
      - $ref: '#/components/schemas/beneficiary_info_natural_id_required'
      - $ref: '#/components/schemas/beneficiary_info_legal_id_required'
      - $ref: '#/components/schemas/beneficiary_is_self'
      discriminator:
        propertyName: type
        mapping:
          individual: '#/components/schemas/beneficiary_info_natural_id_required'
          company: '#/components/schemas/beneficiary_info_legal_id_required'
          self: '#/components/schemas/beneficiary_is_self'
    beneficiary_info_natural_id_phone_required:
      description: 'Individual beneficiary that must carry a national identification number AND

        a phone number. COP''s BANK-TRANSFER B2C corridor requires CPN

        RECIPIENT_PHONE_NUMBER for individuals (company / self are unaffected).

        '
      allOf:
      - $ref: '#/components/schemas/beneficiary_info_natural'
      - required:
        - national_identification_number
        - phone_number
    beneficiary_info_with_national_id_and_phone:
      description: 'COP identity. Like beneficiary_info_with_national_id, but the individual

        branch also requires a phone number (CPN RECIPIENT_PHONE_NUMBER is mandatory

        for COP B2C payouts; the company and self branches are unchanged).

        '
      oneOf:
      - $ref: '#/components/schemas/beneficiary_info_natural_id_phone_required'
      - $ref: '#/components/schemas/beneficiary_info_legal_id_required'
      - $ref: '#/components/schemas/beneficiary_is_self'
      discriminator:
        propertyName: type
        mapping:
          individual: '#/components/schemas/beneficiary_info_natural_id_phone_required'
          company: '#/components/schemas/beneficiary_info_legal_id_required'
          self: '#/components/schemas/beneficiary_is_self'
    beneficiary_info_natural_state_province_required:
      description: Individual whose beneficiary address must carry a state/province (e.g. CN).
      allOf:
      - $ref: '#/components/schemas/beneficiary_info_natural'
      - type: object
        properties:
          address:
            type: object
            required:
            - state_province
    beneficiary_info_legal_state_province_required:
      description: Company whose beneficiary address must carry a state/province (e.g. CN).
      allOf:
      - $ref: '#/components/schemas/beneficiary_info_legal'
      - type: object
        properties:
          address:
            type: object
            required:
            - state_province
    beneficiary_info_with_state_province:
      description: 'Identity for corridors that require a state/province in the beneficiary

        address (e.g. CN). ''self'' carries no address in the payload — it is taken

        from the originator company at payout time.

        '
      oneOf:
      - $ref: '#/components/schemas/beneficiary_info_natural_state_province_required'
      - $ref: '#/components/schemas/beneficiary_info_legal_state_province_required'
      - $ref: '#/components/schemas/beneficiary_is_self'
      discriminator:
        propertyName: type
        mapping:
          individual: '#/components/schemas/beneficiary_info_natural_state_province_required'
          company: '#/components/schemas/beneficiary_info_legal_state_province_required'
          self: '#/components/schemas/beneficiary_is_self'
    beneficiary_info_business_choice:
      description: 'Identity for corridors that only serve business beneficiaries (HK FPS

        routes are B2B/C2B): a company, or ''self'' (the originator company).

        Individuals are not accepted — CPN has no FPS B2C route.

        '
      oneOf:
      - $ref: '#/components/schemas/beneficiary_info_legal'
      - $ref: '#/components/schemas/beneficiary_is_self'
      discriminator:
        propertyName: type
        mapping:
          company: '#/components/schemas/beneficiary_info_legal'
          self: '#/components/schemas/beneficiary_is_self'
    beneficiary_typed_digital:
      description: Crypto payout — wallet address, optional tag.
      type: object
      required:
      - corridor
      - description
      - wallet_details
      - beneficiary_info
      properties:
        corridor:
          type: string
          enum:
          - digital
        description:
          $ref: '#/components/schemas/beneficiary_description'
        wallet_details:
          oneOf:
          - allOf:
            - $ref: '#/components/schemas/beneficiary_wallet_details_digital'
            - not:
                required:
                - tag
          - allOf:
            - $ref: '#/components/schemas/beneficiary_wallet_details_digital'
            - type: object
              required:
              - tag
              properties:
                tag:
                  type: string
        beneficiary_info:
          $ref: '#/components/schemas/beneficiary_info_choice'
    beneficiary_typed_eur:
      description: EUR / SEPA payout — IBAN + name + address.
      type: object
      required:
      - corridor
      - description
      - wallet_details
      - beneficiary_info
      properties:
        corridor:
          type: string
          enum:
          - EUR
        description:
          $ref: '#/components/schemas/beneficiary_description'
        wallet_details:
          type: object
          required:
          - asset
          - account_number
          - account_number_type
          - bank_identifier
          - bank_identifier_type
          properties:
            asset:
              type: string
              enum:
              - EUR
            account_number:
              allOf:
              - $ref: '#/components/schemas/account_number'
              description: IBAN.
            account_number_type:
              type: string
              enum:
              - iban
            bank_identifier:
              allOf:
              - $ref: '#/components/schemas/bank_identifier'
              description: BIC.
            bank_identifier_type:
              type: string
              enum:
              - bic
        beneficiary_info:
          $ref: '#/components/schemas/beneficiary_info_choice'
