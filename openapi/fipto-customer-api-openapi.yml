      type: string
      enum:
      - completed
      - incomplete
    beneficiary_status:
      description: Beneficiary status
      type: string
      enum:
      - active
      - pending
      - rejected
      - awaiting_approval
    fiat_reference:
      type: string
      pattern: ^[a-zA-Z0-9-.&/\s]*$
      minLength: 6
      maxLength: 35
      description: Payment reference used in fiat transactions to convey information about the payment being made. Allow alphanumeric,
        -, ., &, /, space and all accented characters. The minimum length must be 6 characters without counting the spaces.
    payment_link_reference:
      allOf:
