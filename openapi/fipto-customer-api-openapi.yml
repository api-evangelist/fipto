                  properties:
                    data:
                      $ref: '#/components/schemas/wallet_data'
  /companies/{company_id}/aisp-pisp/transactions:
    get:
      summary: Get transactions for an AISP PISP
      description: Retrieve the list of all transactions in your company for an AISP PISP, with the ability to apply filters
        based on the wallet, transaction type, and pagination.
      operationId: searchTransactionsAISPPISPByCompanyId
      tags:
      - AISP/PISP
      parameters:
      - $ref: '#/components/parameters/company_id'
      - $ref: '#/components/parameters/page_number'
      - $ref: '#/components/parameters/page_size'
      - name: sort
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/sort_transaction_list'
      - $ref: '#/components/parameters/filter_transaction_types'
      - $ref: '#/components/parameters/filter_wallet_id'
      responses:
        '200':
          description: Retrieve list of transactions.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/meta'
                - $ref: '#/components/schemas/pagination'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/transaction_data'
  /companies/{company_id}/aisp-pisp/transactions/{transaction_id}:
    get:
      summary: Get a transaction for an AISP PISP
      description: Retrieve a specific transaction by its unique identifier for an AISP PISP.
      operationId: getTransactionAISPPISP
      tags:
      - AISP/PISP
      parameters:
      - $ref: '#/components/parameters/company_id'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Retrieve a transaction for an AISP/PISP.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/meta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/transaction_data'
  /companies/{company_id}/aisp-pisp/beneficiaries:
    get:
      summary: List beneficiaries for an AISP/PISP
      operationId: listBeneficiariesAISPPISP
      description: Retrieve all beneficiaries for an AISP/PISP.
      tags:
      - AISP/PISP
      parameters:
      - $ref: '#/components/parameters/company_id'
      - $ref: '#/components/parameters/page_number'
      - $ref: '#/components/parameters/page_size'
      - $ref: '#/components/parameters/sort'
      responses:
        '200':
          description: List of all beneficiaries.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/meta'
                - $ref: '#/components/schemas/pagination'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/beneficiary_data'
  /companies/{company_id}/aisp-pisp/beneficiaries/{beneficiary_id}:
    get:
      summary: Get a beneficiary for an AISP/PISP
      operationId: getBeneficiaryAISPPISP
      description: Retrieve a specific beneficiary by its unique identifier for an AISP/PISP.
      tags:
      - AISP/PISP
      parameters:
      - $ref: '#/components/parameters/company_id'
      - $ref: '#/components/parameters/beneficiary_id'
      responses:
        '200':
          description: Retrieve a beneficiary.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/meta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/beneficiary_data'
  /companies/{company_id}/wallets/{wallet_id}/payin-simulation:
    post:
      summary: Simulate a payin
      description: Generate a payin on the demo environment. Note that it may take up to 1 minute for the payin to appear
        in the transactions list. By default, the payin will target the first wallet details created within the wallet.
      operationId: simulatePayin
      tags:
      - Payin Simulation
      parameters:
      - $ref: '#/components/parameters/company_id'
      - $ref: '#/components/parameters/wallet_id'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - data
              properties:
                data:
                  $ref: '#/components/schemas/payin_simulation_data'
      responses:
        '204':
          description: Payin simulation successful.
  /companies/{company_id}/conversions/{conversion_id}:
    get:
      summary: Retrieve a list of filterable conversions
      operationId: getConversion
      tags:
      - Conversions
      parameters:
      - $ref: '#/components/parameters/company_id'
      - $ref: '#/components/parameters/conversion_id'
      responses:
        '200':
          description: A conversion.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/meta'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/public_conversion_data'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - message
                    properties:
                      message:
                        type: string
                        enum:
                        - Conversion not found.
