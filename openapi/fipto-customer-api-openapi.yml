        wallet_details_iban:
          type: string
          description: The IBAN associated with a wallet details.
    payin_status:
      type: string
      enum:
      - reconciled
      - screening partner compliance - in review
      - screening partner compliance - reviewed
      - screening partner compliance - failed
      - internal compliance - reviewed
      - internal compliance - medium risk
      - internal compliance - high risk
      - internal compliance - to be returned
      - internal compliance - rejected
      - completed
