      - $ref: '#/components/schemas/data_default'
      - type: object
        properties:
          type:
            type: string
            enum:
            - account_statement_period
          attributes:
            type: object
            required:
            - year
            - month
            properties:
              year:
                type: integer
                example: 2026
                description: The year of the period.
              month:
                type: integer
                minimum: 1
                maximum: 12
                example: 2
                description: The month of the period (1-12).
    account_statement_period_wallet_data:
      description: A wallet present in a period's source file (exportable for that period).
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - account_statement_period_wallet
        id:
          type: string
          format: uuid
          description: The wallet UUID present in the period's source file.
    account_statement_export_request_data:
      description: Account-statement export request.
      allOf:
      - $ref: '#/components/schemas/data_default'
      - type: object
        properties:
          type:
            type: string
            enum:
            - account_statement_export
          attributes:
            type: object
            required:
            - year
            - month
            - wallet_ids
            properties:
              year:
                type: integer
                example: 2026
                description: The year of the period to export.
              month:
                type: integer
                minimum: 1
                maximum: 12
                example: 2
                description: The month of the period to export (1-12).
              wallet_ids:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/uuid'
                example:
                - 9aaa1c57-3025-4a27-95da-218bf79f9eb5
                description: The non-empty list of wallet IDs to include in the export.
    account_statement_export_data:
      description: Account-statement export status.
      allOf:
      - $ref: '#/components/schemas/object_id'
      - type: object
        properties:
          type:
            type: string
            enum:
            - account_statement_export
          attributes:
            type: object
            required:
            - status
            properties:
              status:
                $ref: '#/components/schemas/account_statement_export_status'
              url:
                type: string
                format: uri
                example: https://assets.fipto.com/account-statements/exports/6f3d0c2a.zip?X-Amz-Signature=...
                description: The presigned URL to download the export. Present only when status is ready.
              expiration_date:
                type: string
                format: date-time
                example: '2026-06-05T12:34:56Z'
                description: The expiration date of the download URL. Present only when status is ready.
              error:
                type: string
                example: source file not found for the requested period
                description: A human-readable error message. Present only when status is failed.
