vulnerability_disclosure:
  published: false
  note: >-
    Neither page — nor any page in the sitemap — publishes a vulnerability disclosure policy, a bug
    bounty program, a responsible-disclosure address or a security@ contact, and
    /.well-known/security.txt returns 404 on every host. For an ISO 27001-certified, dual-licensed
    payment institution this is the most conspicuous gap in an otherwise strong posture. No
    `Security` or `VulnerabilityDisclosure` pointer is emitted in apis.yml, because there is nothing
    published to point at.
